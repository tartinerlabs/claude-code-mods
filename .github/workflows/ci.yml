name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_VERSION: 2.1.292
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb  # v6.1.0
        with:
          version: 12.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 'lts/*'
      - name: Validate marketplace
        run: pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin validate --strict .
      - name: Validate and test each mod
        run: |
          failed=()
          for mod in plugins/*/; do
            mod=${mod%/}
            echo "::group::$mod"
            pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin validate --strict "$mod" \
              && pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin test "$mod" \
              || failed+=("$mod")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed mods: ${failed[*]}"
            exit 1
          fi
