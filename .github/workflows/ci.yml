name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        claude-code: [stable, latest]
    env:
      CLAUDE_CODE_VERSION: ${{ matrix.claude-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024  # v3.0.0
        with:
          version: 12.4.1
          runtime: node@lts
      - name: Validate marketplace
        run: pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin validate --strict .
      - name: Validate and test each mod
        run: |
          failed=()
          for mod in plugins/*/; do
            mod=${mod%/}
            echo "::group::$mod"
            pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin validate --strict "$mod" \
              && pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin test "$mod" \
              || failed+=("$mod")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed mods: ${failed[*]}"
            exit 1
          fi
